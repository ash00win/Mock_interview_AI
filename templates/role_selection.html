{% include 'user_header.html' %}

<center>


    <h3 style="margin-top: 150px;">Select Role for Interview</h3>
    <form action="/start_interview" method="post">
        <label style="margin-top: 40px;" for="role"><h5>Role: &nbsp;</h5> </label>
        <select name="role" id="role"  required>
            <option value="">Select</option>
            <!-- Add options for roles here -->
             {% for i in r %}
            <option value="{{i.role_name}}">{{i.role_name}}</option>
            {% endfor %}

            <!-- Add more roles as needed -->
        </select>
        &nbsp;
        <button type="submit" class="btn btn-success">Start Interview</button>
    </form>
</center>
